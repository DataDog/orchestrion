%YAML 1.1
---
# A06: the template spells the file's real alias. The alias is in scope at
# the join point, so the generated reference reuses it, and no synthetic
# import is registered.
aspects:
  - join-point:
      function-call: os.Getenv
    advice:
      - wrap-expression:
          imports:
            str: strings
          template: str.ToUpper({{ . }})

code: |-
  package test

  import (
    "os"
    str "strings"
  )

  func helper(s string) string { return str.ToLower(s) }

  func home() string {
    return os.Getenv("HOME")
  }
