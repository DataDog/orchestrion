%YAML 1.1
---
# D06: the package-level declaration of the base name lives in another file of
# the package: package scope, not file scope, decides.
aspects:
  - join-point:
      function-call: os.Getenv
    advice:
      - wrap-expression:
          imports:
            strings: strings
          template: strings.ToUpper({{ . }})

syntheticReferences:
  strings: true

files:
  extra.go:
    code: |-
      package test

      var __orchestrion_strings int

code: |-
  package test

  import (
    "os"
    str "strings"
  )

  func helper(s string) string { return str.ToLower(s) }

  func home() string {
    str := "shadowed"
    _ = str
    return os.Getenv("HOME")
  }
