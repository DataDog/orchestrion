%YAML 1.1
---
# D09: a versioned import path whose declared package name differs from the
# path base: the real name is reused when it is safe.
modules:
  example.com/trace/v2:
    trace.go: |-
      package trace

      func Trace(s string) string { return "trace:" + s }

aspects:
  - join-point:
      function-call: os.Getenv
    advice:
      - wrap-expression:
          imports:
            tr: example.com/trace/v2
          template: tr.Trace({{ . }})

code: |-
  package test

  import (
    "os"
    "example.com/trace/v2"
  )

  func helper(s string) string { return trace.Trace(s) }

  func home() string {
    return os.Getenv("HOME")
  }
