%YAML 1.1
---
# Aspects for the go1.22 language fixture: Concat needs a Go 1.22 standard
# library, which the toolchain provides regardless of the module's language
# declaration.
meta:
  name: append-args-go122
  description: |-
    Exercises hygienic append-args weaving on a go 1.22 module.

aspects:
  - id: append-args/local.Sink
    join-point:
      function-call: example.com/appendargs-go122/local.Sink
    advice:
      - append-args:
          type: example.com/appendargs-go122/local.Opt
          values:
            - imports:
                local: example.com/appendargs-go122/local
              template: local.Named("traced")
