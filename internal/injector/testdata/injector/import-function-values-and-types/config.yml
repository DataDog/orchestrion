%YAML 1.1
---
# C13: package-qualified function values and type names are rewritten too,
# not only call expressions.
aspects:
  - join-point:
      function-call: os.Getenv
    advice:
      - wrap-expression:
          imports:
            strings: strings
          template: strings.ToUpper({{ . }})

syntheticReferences:
  strings: true

code: |-
  package test

  import (
    "net/http"
    "os"
    str "strings"
  )

  var f = str.ToLower
  var c *http.Client

  func helper(s string) string { return str.ToLower(s) }

  func home() string {
    str := "shadowed"
    _ = str
    return os.Getenv("HOME")
  }
