%YAML 1.1
---
# C04: the base generated name collides at both an original reference and the
# generated one: the alias must be free at the union of all references.
aspects:
  - join-point:
      function-call: os.Getenv
    advice:
      - wrap-expression:
          imports:
            strings: strings
          template: strings.ToUpper({{ . }})

syntheticReferences:
  strings: true

code: |-
  package test

  import (
    "os"
    str "strings"
  )

  func helper(s string) string {
    __orchestrion_strings := 1
    _ = __orchestrion_strings
    return str.ToLower(s)
  }

  func home() string {
    str := "shadowed"
    __orchestrion_strings := 1
    _, _ = str, __orchestrion_strings
    return os.Getenv("HOME")
  }
