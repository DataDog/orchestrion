%YAML 1.1
---
# A01: the file imports strings without an alias and nothing shadows it:
# the generated reference reuses the real package name, and no synthetic
# import is registered.
aspects:
  - join-point:
      function-call: os.Getenv
    advice:
      - wrap-expression:
          imports:
            strings: strings
          template: strings.ToUpper({{ . }})

code: |-
  package test

  import (
    "os"
    "strings"
  )

  func helper(s string) string { return strings.ToLower(s) }

  func home() string {
    return os.Getenv("HOME")
  }
