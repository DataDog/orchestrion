%YAML 1.1
---
# C06: the source alias is shadowed only in a function with no reference to the
# path: the alias is reused and no synthetic reference is registered.
aspects:
  - join-point:
      function-call: os.Getenv
    advice:
      - wrap-expression:
          imports:
            strings: strings
          template: strings.ToUpper({{ . }})

code: |-
  package test

  import (
    "os"
    str "strings"
  )

  func unrelated() string {
    str := "shadowed"
    _ = str
    return "unrelated"
  }

  func helper(s string) string { return str.ToLower(s) }

  func home() string {
    return os.Getenv("HOME")
  }
