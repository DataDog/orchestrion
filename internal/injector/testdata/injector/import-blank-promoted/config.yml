%YAML 1.1
---
# A09: the file only blank-imports strings; a qualified reference promotes
# the import to one safe named import.
aspects:
  - join-point:
      function-call: os.Getenv
    advice:
      - wrap-expression:
          imports:
            strings: strings
          template: strings.ToUpper({{ . }})

syntheticReferences:
  strings: true

code: |-
  package test

  import (
    "os"
    _ "strings"
  )

  func home() string {
    return os.Getenv("HOME")
  }
