%YAML 1.1
---
# F02: append-arguments on a spread call. The pre-fix rewrite generated a
# FuncLit whose parameter shared the file's alias spelling and forced an alias.
# The hygienic rewrite introduces no binding, so the file's own opts alias is
# reused everywhere and only slices is a synthetic import.
modules:
  example.com/opts:
    opts.go: |-
      package opts

      type Option struct{ Name string }

      func Print(opts ...Option) {}

aspects:
  - join-point:
      function-call: example.com/opts.Print
    advice:
      - append-args:
          type: example.com/opts.Option
          values:
            - template: 'opts.Option{Name: "traced"}'
              imports:
                opts: example.com/opts

syntheticReferences:
  slices: true

required-lang: go1.18

code: |-
  package test

  import (
    "os"
    opts "example.com/opts"
  )

  var _ = os.Getenv

  func printAll(args ...opts.Option) {
    opts.Print(args...)
  }
