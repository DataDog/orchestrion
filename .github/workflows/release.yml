name: Release
on:
  pull_request:
    paths:
      - internal/version/version.go
      - .github/workflows/release.yml
      - .github/chainguard/self.github.release.*.sts.yaml
      - _tools/tag-submodules.sh
      - _tools/test_tag_submodules.py
  push:
    branches: [main]
    paths: [internal/version/version.go]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to repair (for example, v1.13.1)'
        required: true
        type: string
permissions: read-all
jobs:
  test-tagger:
    if: github.event_name == 'pull_request'
    name: Test release tagging
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Check shell script
        run: shellcheck -x _tools/tag-submodules.sh
      - name: Test against local Git repositories
        run: python3 -m unittest discover -v -s _tools -p 'test_tag_submodules.py'
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    name: Validate Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # To be able to create draft releases
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v5
        with:
          go-version: stable
          cache-dependency-path: '**/go.mod'
      # Obtains the current configured version tag from source, and verifies it is a valid tag name.
      # Also checks whether the tag already exists.
      - name: Determine version
        id: version
        run: |-
          set -euo pipefail
          # Adapted from https://semver.org/#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string,
          # with a v prefix and \d replaced by [0-9] since GNU grep -E does not support \d.
          VERSION_TAG_REGEX='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          version=$(grep -E "${VERSION_TAG_REGEX}" <(go run . version -static | cut -d' ' -f 2))
          echo "tag=${version}" >> "${GITHUB_OUTPUT}"
          if gh release view "${version}" --json isDraft; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # If this is a pull request, and the release does not yet exist, the PR title must be "release: <tag>"
      - name: 'Pull Request title must be "release: ${{ steps.version.outputs.tag }}"'
        if: "github.event_name == 'pull_request' && !fromJSON(steps.version.outputs.exists) && format('release: {0}', steps.version.outputs.tag) != github.event.pull_request.title"
        run: |-
          echo "Please update the PR title to \"release: ${{ steps.version.outputs.tag }}\" (instead of ${EVENT_PR_TITLE})"
          exit 1
        env:
          EVENT_PR_TITLE: ${{ toJSON(github.event.pull_request.title) }}
      # Release must not already exist (if the PR title suggests this is intended to be a release)
      - name: Release ${{ steps.version.outputs.tag }} already exists
        if: github.event_name == 'pull_request' && fromJSON(steps.version.outputs.exists) && startsWith(github.event.pull_request.title, 'release:')
        run: |-
          echo 'A release already exists for tag ${{ steps.version.outputs.tag }}. Please update to another version.'
          exit 1
      # If the release does not yet exist, create a draft release targeting this commit.
      - name: Create draft release
        if: github.event_name == 'push' && steps.version.outputs.exists == 'false'
        # We explicitly set the notes start tag because GitHub otherwise does not make the right
        # decision (it is very sensitive to non-version tags being present in the repository, and
        # the Go nexted modules tags hinder it). We pick the latest non-prerelease tag as the start
        # tag, always.
        run: |-
          lastTag=$(gh release list                                                                 \
            --exclude-drafts                                                                        \
            --exclude-pre-releases                                                                  \
            --limit=1                                                                               \
            --json=tagName                                                                          \
            --template="{{ (index . 0).tagName }}"                                                  \
          )
          gh release create '${{ steps.version.outputs.tag }}'                                      \
            --draft                                                                                 \
            --generate-notes                                                                        \
            --target='${{ github.sha }}'                                                            \
            --title='${{ steps.version.outputs.tag }}'                                              \
            --notes-start-tag="${lastTag}"                                                          \
            ${{ contains(steps.version.outputs.tag, '-') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
  release:
    if: >-
      github.repository == 'DataDog/orchestrion' && (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    name: Tag Release
    runs-on: ubuntu-latest
    concurrency:
      group: release-tags-${{ github.event.release.tag_name || inputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Obtain a repository-scoped GitHub App token through dd-octo-sts.
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      # Keep automation from the workflow revision, including when repairing an older release
      # through workflow_dispatch on main. The helper reads release metadata with git show.
      - name: Checkout automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event_name == 'release' && github.sha || '' }}
        run: |-
          set -euo pipefail
          source _tools/tag-submodules.sh
          sha=$(resolve_release "${RELEASE_TAG}")
          if [[ -n "${EXPECTED_SHA}" && "${sha}" != "${EXPECTED_SHA}" ]]; then
            printf 'Root tag does not match the release event commit.\n' >&2
            exit 1
          fi
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
      - name: Get GitHub token (DataDog/orchestrion)
        id: generate-token
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        with:
          scope: DataDog/orchestrion
          policy: ${{ github.event_name == 'release' && 'self.github.release.published' || 'self.github.release.manual' }}
      - name: Tag all submodules
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: bash _tools/tag-submodules.sh "${RELEASE_TAG}" "${RELEASE_SHA}"
