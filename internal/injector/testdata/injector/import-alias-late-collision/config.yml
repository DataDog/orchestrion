%YAML 1.1
---
# C08: a later join point invalidates the base candidate for the whole file;
# earlier generated references follow the final choice.
aspects:
  - join-point:
      function-call: os.Getenv
    advice:
      - wrap-expression:
          imports:
            strings: strings
          template: strings.ToUpper({{ . }})

syntheticReferences:
  strings: true

code: |-
  package test

  import (
    "os"
    str "strings"
  )

  func helper(s string) string { return str.ToLower(s) }

  func homeA() string {
    str := "shadowed"
    _ = str
    return os.Getenv("HOME")
  }

  func homeB() string {
    str := "shadowed"
    __orchestrion_strings := 1
    _, _ = str, __orchestrion_strings
    return os.Getenv("HOME")
  }
