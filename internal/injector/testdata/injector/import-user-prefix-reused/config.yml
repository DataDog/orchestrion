%YAML 1.1
---
# A12: a user alias spelled exactly like the generated base name, accessible
# everywhere: it is reused as the file's real alias, and no synthetic
# import is registered.
aspects:
  - join-point:
      function-call: os.Getenv
    advice:
      - wrap-expression:
          imports:
            strings: strings
          template: strings.ToUpper({{ . }})

code: |-
  package test

  import (
    "os"
    __orchestrion_strings "strings"
  )

  func helper(s string) string { return __orchestrion_strings.ToLower(s) }

  func home() string {
    return os.Getenv("HOME")
  }
