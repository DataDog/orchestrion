%YAML 1.1
---
# Conversions to instantiated generic named types are type operations,
# not generic function calls; they never match this path (matrix B09,
# B10, B22 for the local form). Ctl is the positive control that proves
# the aspect is live, so the missing wraps are meaningful non-matches.
aspects:
  - join-point:
      one-of:
        - function-call: Wrap
        - function-call: Callback
        - function-call: Ctl
    advice:
      - wrap-expression:
          template: Mark({{ . }})

code: |-
  package test

  type Wrap[T any] []T
  type Callback[T any] func(T) T

  func Mark[T any](v T) T { return v }
  func Ctl[T any](v T) T  { return v }

  func Use(
    f func(int) int,
  ) (Wrap[int], Callback[int], int) {
    _ = Ctl[int](0)
    return Wrap[int]([]int{}), Callback[int](f), 0
  }
