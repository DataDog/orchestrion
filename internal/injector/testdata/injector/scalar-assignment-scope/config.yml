%YAML 1.1
---
aspects:
  - id: capture-string-byte
    join-point:
      value-operation: capture-string-byte
    advice:
      - insert-statements-after:
          imports:
            taint: github.com/DataDog/orchestrion/runtime/taint
          template: |-
            {{- $target := index .AST.Lhs 0 -}}
            {{- $source := index .AST.Rhs 0 -}}
            taint.MarkByteFromString(&{{ $target.Copy }}, {{ $source.X.Copy }}, {{ $source.Index.Copy }})
            defer taint.ReleaseByte(&{{ $target.Copy }})

syntheticReferences:
  github.com/DataDog/orchestrion/runtime/taint: true

code: |-
  package test

  var global byte

  func assignGlobal(source string) {
    global = source[0]
  }

  func assignOuter(source string) byte {
    var outer byte
    func() {
      outer = source[0]
    }()
    return outer
  }

  func assignLocal(source string) byte {
    var local byte
    if len(source) > 0 {
      local = source[0]
    }
    return local
  }
