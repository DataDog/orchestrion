%YAML 1.1
---
# T02: the caller is generic; the configured type is the caller's in-scope type
# parameter T and the injected value is a T-typed argument. The explicit []T
# instantiation must keep the actual T.
aspects:
  - join-point:
      function-call: sink
    advice:
      - append-args:
          type: T
          values:
            - template: '{{ .Function.Argument 1 }}'

syntheticReferences:
  slices: true

required-lang: go1.18

code: |-
  package test

  func sink[T any](vals ...T) {}

  func generic[T any](vals []T, extra T) {
    sink(vals...)
  }
