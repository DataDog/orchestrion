name: Dependency Updates
on:
  schedule:
    - cron: '42 5 * * 1' # Mondays at 5:42 AM
  workflow_dispatch: {} # Manual runs
permissions:
  contents: read
jobs:
  update-go:
    name: Update Go Dependencies
    runs-on: ubuntu-latest
    outputs:
      changes-needed: ${{ steps.is-tree-dirty.outputs.result }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up Go
        id: setup-go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v5
        with:
          # Run with current stable so we can evaluate all possible versions; as the Go toolchain
          # will bail out if it encounters a "candidate" that requires a newer release.
          go-version: stable
          cache-dependency-path: '**/go.mod'
      - name: Determine latest github.com/DataDog/dd-trace-go/v2 version
        id: dd-trace-go
        run: |-
          set -euo pipefail
          version=$(go list -f '{{range .Versions}}{{.}}{{"\n"}}{{end}}' -m -versions github.com/DataDog/dd-trace-go/v2 | grep -v '-' | tail -n 1)
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      # Passing "go@<version>" to "go get -u" ensures no dependencies get upgraded to a release that
      # does not support that specific go release. We do `go get -u` everywhere first, and then
      # `go mod tidy`, so that the later accounts for the complete updated module graph (otherwise
      # we'd need to run these in dependency order to ensure stable output).
      - name: Update dependencies
        env:
          DD_TRACE_GO_VERSION: ${{ steps.dd-trace-go.outputs.version }}
        run: |-
          set -euo pipefail
          find . -iname go.mod -not -path './_docs/themes/**' -not -path './internal/pin/testdata/**' -print0 | LC_ALL=C sort -z | while IFS= read -r -d '' gomod; do
            dir="$(dirname "${gomod}")"
            modjson="$(go -C="${dir}" mod edit -json)"
            args=("go@$(jq -r .Go <<<"${modjson}")")
            # Only name dd-trace-go/v2 in modules that already require it: "go get" would otherwise
            # add it to modules that do not use it (such as _tools), and fail if their go release
            # is older than the one that dd-trace-go/v2 requires.
            if jq -e 'any(.Require[]?; .Path == "github.com/DataDog/dd-trace-go/v2")' >/dev/null <<<"${modjson}"; then
              args+=("github.com/DataDog/dd-trace-go/v2@${DD_TRACE_GO_VERSION}")
            fi
            # v1.38.1 is the last release using the Shopify module path. Keep the legacy
            # integration coverage: newer releases declare github.com/IBM/sarama instead.
            if jq -e 'any(.Require[]?; .Path == "github.com/Shopify/sarama")' >/dev/null <<<"${modjson}"; then
              args+=(github.com/Shopify/sarama@v1.38.1)
            fi
            echo "::group::go get in ${dir}: ${args[*]}"
            if ! go -C="${dir}" get -t -u "${args[@]}" ./...; then
              echo "::endgroup::"
              echo "::error title=go get failed::${dir}: go get -t -u ${args[*]} ./..."
              exit 1
            fi
            echo "::endgroup::"
          done
      - name: Run go mod tidy
        run: |-
          set -euo pipefail
          find . -iname go.mod -not -path './_docs/themes/**' -not -path './internal/pin/testdata/**' -print0 | LC_ALL=C sort -z | while IFS= read -r -d '' gomod; do
            dir="$(dirname "${gomod}")"
            go_version="$(go -C="${dir}" mod edit -json | jq -r .Go)"
            echo "::group::go mod tidy in ${dir}"
            if ! go -C="${dir}" mod tidy -go="${go_version}" || ! go -C="${dir}" mod edit -toolchain=none; then
              echo "::endgroup::"
              echo "::error title=go mod tidy failed::${dir}"
              exit 1
            fi
            echo "::endgroup::"
          done
      - id: is-tree-dirty
        name: Check for updates
        run: |-
          git add .
          git diff --staged --patch --exit-code || echo "result=true" >> "${GITHUB_OUTPUT}"
      - name: Update LICENSE-3rdparty.csv
        if: steps.is-tree-dirty.outputs.result == 'true'
        run: ./_tools/make-licenses.sh
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Build diff
        if: steps.is-tree-dirty.outputs.result == 'true'
        run: |-
          git add .
          git diff --staged --patch > "${{ runner.temp }}/go.diff.patch"
      - name: Upload Artifact
        if: steps.is-tree-dirty.outputs.result == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Patches
          path: ${{ runner.temp }}/go.diff.patch
          if-no-files-found: error
  create-pr:
    name: Create Pull Request
    runs-on: ubuntu-latest
    needs: [update-go]
    if: needs.update-go.outputs.changes-needed == 'true'
    permissions:
      id-token: write # To mint the dd-octo-sts token (policy: self.github.deps-update.schedule)
      contents: write # To push the automation/dependency-updates branch that carries the patch
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Download patches
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Patches
          path: ${{ runner.temp }}/patches
      - name: Apply patches
        run: find "${{ runner.temp }}/patches" -type f -name '*.patch' -exec git apply {} \;
      # We use ghcommit to create signed commits directly using the GitHub API
      - name: Create branch # The branch needs to exist before we can add commits to it
        id: create-branch
        run: |-
          branch="automation/dependency-updates/${{ github.run_id }}"
          git push origin "${{ github.sha }}":"refs/heads/${branch}"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"
          git fetch origin "${branch}"
      - name: Get GitHub token (DataDog/orchestrion)
        id: generate-token
        uses: DataDog/dd-octo-sts-action@c85802a58e202b7e764b5441e4378c76043c8108 # v1.0.5
        with:
          scope: DataDog/orchestrion
          policy: self.github.deps-update.schedule
      - name: Create Commit # Adds a commit to the branch we created above
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          commit_message: "chore: update all dependencies"
          repo: ${{ github.repository }}
          branch: ${{ steps.create-branch.outputs.branch }}
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
      - name: Create PR
        run: |-
          git fetch origin "${{ steps.create-branch.outputs.branch }}"
          git reset --hard HEAD
          git switch "${{ steps.create-branch.outputs.branch }}"
          gh pr create --title "chore: update all dependencies" \
                       --body "Updated all go.mod dependencies to latest." \
                       --head="${{ steps.create-branch.outputs.branch }}"
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
