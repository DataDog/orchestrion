%YAML 1.1
---
meta:
  name: compile-loop
  description: |-
    Injects a dependency on a package that itself depends on the instrumented
    one, which is what happens when a package's own tests exercise a call site an
    integration instruments.

aspects:
  - id: victim.Work
    join-point:
      function-body:
        function:
          - name: Work
    advice:
      - prepend-statements:
          imports:
            tracer: example.com/compileloop/tracer
          template: tracer.Trace()
