%YAML 1.1
---
# Z03: zero value templates on non-spread calls. Advice is a true no-op: the
# modified flag is false and no imports or language version are requested. The
# positive control proves the file weaves: the same advice with one template is
# live on the control callee, and only the control call changes.
aspects:
  - join-point:
      function-call: sink
    advice:
      - append-args:
          type: any
          values: []

  - join-point:
      function-call: sinkControl
    advice:
      - append-args:
          type: any
          values:
            - template: '"woven"'

syntheticReferences:
  slices: true

required-lang: go1.18

code: |-
  package test

  func sink(vals ...any) {}

  func sinkControl(vals ...any) {}

  func zero(xs []any) {
    sink()
    sinkControl(xs...)
  }

  func one(x any) {
    sink(x)
  }
