%YAML 1.1
---
# A non-generic source call replaced by a generic target keeps the existing
# whole-callee
# replacement and lets the compiler infer the type arguments (matrix A19).
aspects:
  - join-point:
      function-call: Plain
    advice:
      - replace-function: F

code: |-
  package test

  func F[A any](a A) A { return a }
  func Plain(a int) int { return a }

  func Use() int {
    return Plain(1)
  }
