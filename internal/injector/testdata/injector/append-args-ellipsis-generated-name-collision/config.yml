%YAML 1.1
---
# H11: locals occupy the generated base names of the slices and type-package
# imports; the planner must select suffixed aliases for all of them and the
# caller values must stay intact.
aspects:
  - join-point:
      function-call: sink
    advice:
      - append-args:
          type: example.com/optlib.Option
          values:
            - imports:
                optlib: example.com/optlib
              template: optlib.Named("woven")

syntheticReferences:
  example.com/optlib: true
  slices: true

required-lang: go1.18

modules:
  example.com/optlib:
    optlib.go: |-
      package optlib

      type Option struct{ Name string }

      type OptionAlias = Option
      type AnyAlias = any
      type Thing struct{ Name string }

      var Woven any = "woven"

      func Named(name string) Option { return Option{Name: name} }

      func Sink(opts ...Option) []Option { return opts }
      func Sink2(opts ...Option) []Option { return opts }
      func SinkAny(vals ...any) []any { return vals }
      func SinkOpt(opts ...Option) []Option { return opts }
      func Redirect(opts ...Option) []Option { return opts }
      func Redirected(opts ...Option) []Option { return opts }
      func Wrapped(o []Option) []Option { return o }

      type Server struct{}

      func (s Server) Serve(opts ...Option) {}

code: |-
  package test

  import o "example.com/optlib"

  var _ = o.Named

  func sink(vals ...o.Option) {}

  func printAll(ws []o.Option) {
    __orchestrion_optlib := 1
    __orchestrion_slices := 2
    _, _ = __orchestrion_optlib, __orchestrion_slices
    o := false
    _ = o
    sink(ws...)
  }
