%YAML 1.1
---
# C01: the base generated name is also shadowed by a local at the join point:
# the first free suffixed candidate is used for all references.
aspects:
  - join-point:
      function-call: os.Getenv
    advice:
      - wrap-expression:
          imports:
            strings: strings
          template: strings.ToUpper({{ . }})

syntheticReferences:
  strings: true

code: |-
  package test

  import (
    "os"
    str "strings"
  )

  func helper(s string) string { return str.ToLower(s) }

  func home() string {
    str := "shadowed"
    __orchestrion_strings := 1
    _, _ = str, __orchestrion_strings
    return os.Getenv("HOME")
  }
