%YAML 1.1
---
aspects:
  - id: maximal-string-concat
    join-point:
      string-concat:
        min-operands: 2
        max-operands: 4
    advice:
      - wrap-expression:
          template: |-
            markConcat(
              {{- range .StringConcatOperands }}
              {{ . }},
              {{- end }}
            )
  - id: string-slice
    join-point:
      slice-expression:
        operand: string
    advice:
      - wrap-expression:
          template: markString({{ .AST }})
  - id: bytes-to-string
    join-point:
      type-conversion:
        from: bytes
        to: string
    advice:
      - wrap-expression:
          template: markString({{ .AST }})
  - id: string-to-bytes
    join-point:
      type-conversion:
        from: string
        to: bytes
    advice:
      - wrap-expression:
          template: markBytes({{ .AST }})
  - id: byte-slice
    join-point:
      slice-expression:
        operand: bytes
    advice:
      - wrap-expression:
          template: markBytes({{ .AST }})

code: |-
  package test

  type namedString string
  type namedBytes []byte

  func markConcat(values ...string) string { return "" }
  func markString[T ~string](value T) T { return value }
  func markBytes[T ~[]byte](value T) T { return value }

  func operators(a, b, c string, s namedString, data namedBytes, low, high int) {
    _ = a + b + c
    _ = a + ("x" + "y")
    _ = "x" + "y"
    _ = s[low:high]
    _ = data[low:high]
    _ = data[low:high:cap(data)]
    convertedString := string(data)
    convertedBytes := []byte(s)
    _, _ = convertedString, convertedBytes
    _ = len(string(data))
  }

  func returned(data []byte) string {
    return string(data)
  }

  func returnedBytes(value string) []byte {
    return []byte(value)
  }
