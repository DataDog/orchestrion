%YAML 1.1
---
# D12: vendor mode with a package whose declared name differs from its final
# path element: logical path identity is preserved.
modules:
  example.com/dep/vendoredpkg:
    vv.go: |-
      package vv

      func V(s string) string { return "v:" + s }

vendor: true

aspects:
  - join-point:
      function-call: os.Getenv
    advice:
      - wrap-expression:
          imports:
            dep: example.com/dep/vendoredpkg
          template: dep.V({{ . }})

code: |-
  package test

  import (
    "os"
    "example.com/dep/vendoredpkg"
  )

  func helper(s string) string { return vv.V(s) }

  func home() string {
    return os.Getenv("HOME")
  }
