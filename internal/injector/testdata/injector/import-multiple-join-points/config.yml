%YAML 1.1
---
# D03: several join points with mixed source-alias availability: reuse only if
# the choice is safe for the whole emitted file, otherwise one alias.
aspects:
  - join-point:
      function-call: os.Getenv
    advice:
      - wrap-expression:
          imports:
            strings: strings
          template: strings.ToUpper({{ . }})

syntheticReferences:
  strings: true

code: |-
  package test

  import (
    "os"
    str "strings"
  )

  func helper(s string) string { return str.ToLower(s) }

  func homeA() string {
    return os.Getenv("HOME")
  }

  func homeB() string {
    str := "shadowed"
    _ = str
    return os.Getenv("HOME")
  }
