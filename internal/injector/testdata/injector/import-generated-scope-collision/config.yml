%YAML 1.1
---
# C11: the template itself declares a local of the base name around its own
# generated package use: generated lexical scopes count as collisions.
aspects:
  - join-point:
      function-call: os.Getenv
    advice:
      - wrap-expression:
          imports:
            strings: strings
          template: |-
            func() string {
              __orchestrion_strings := ""
              _ = __orchestrion_strings
              return strings.ToUpper({{ . }})
            }()

syntheticReferences:
  strings: true

code: |-
  package test

  import (
    "os"
    str "strings"
  )

  func helper(s string) string { return str.ToLower(s) }

  func home() string {
    str := "shadowed"
    _ = str
    return os.Getenv("HOME")
  }
