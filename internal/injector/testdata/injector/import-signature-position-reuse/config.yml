%YAML 1.1
---
# P2: a parameter name scopes the function body only, so a
# signature-position reference keeps the file's own alias even when the
# advice requests the import.
aspects:
  - join-point:
      function-call: os.Getenv
    advice:
      - wrap-expression:
          imports:
            strings: strings
          template: strings.ToUpper({{ . }})

code: |-
  package test

  import (
    "os"
    "strings"
  )

  func helper(strings *strings.Replacer) {}

  func home() string {
    return os.Getenv("HOME")
  }
