%YAML 1.1
---
# H13: the generated base and the first suffix candidate are occupied beside
# original slices references in other functions; one alias must be safe at
# every reference in the file. Repeated runs must stay deterministic.
aspects:
  - join-point:
      function-call: fmt.Println
    advice:
      - append-args:
          type: any
          values:
            - template: '"woven"'

syntheticReferences:
  slices: true

required-lang: go1.18

repeat: 20

code: |-
  package test

  import (
    "fmt"
    "slices"
  )

  func helper2(xs []int) bool {
    __orchestrion_slices := 1
    _ = __orchestrion_slices
    return slices.Contains(xs, 1)
  }

  func helper3(xs []int) bool {
    __orchestrion_slices1 := 1
    _ = __orchestrion_slices1
    return slices.Contains(xs, 2)
  }

  func printAll(args []any) {
    slices := "shadowed"
    _ = slices
    fmt.Println(args...)
  }
