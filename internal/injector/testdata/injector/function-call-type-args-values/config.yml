%YAML 1.1
---
# An instantiation stored in a variable is a value, not a call; an
# indirect call through the stored value does not match the original
# target (matrix B01, B02). Ctl is the positive control that proves the
# aspect is live, so the missing wraps are meaningful non-matches.
aspects:
  - join-point:
      one-of:
        - function-call: F
        - function-call: Ctl
    advice:
      - wrap-expression:
          template: Mark({{ . }})

code: |-
  package test

  func Mark[T any](v T) T { return v }
  func F[A any](a A) A   { return a }
  func Ctl[T any](v T) T { return v }

  func Use() int {
    f := F[int]
    _ = Ctl[int](0)
    return f(1)
  }
