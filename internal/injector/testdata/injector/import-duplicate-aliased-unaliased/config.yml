%YAML 1.1
---
# A14: one path imported both without an alias and under an alias, both used.
# The references consolidate onto one safe import; repeated runs must be stable.
aspects:
  - join-point:
      function-call: os.Getenv
    advice:
      - wrap-expression:
          imports:
            strings: strings
          template: strings.ToUpper({{ . }})

repeat: 20

code: |-
  package test

  import (
    "os"
    "strings"
    str "strings"
  )

  func helper(s string) string { return str.ToLower(s) }
  func helper2(s string) string { return strings.ToUpper(s) }

  func home() string {
    return os.Getenv("HOME")
  }
